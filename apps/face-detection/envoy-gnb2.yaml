static_resources:
  listeners:
    - name: face_detection_listener
      address:
        socket_address: {address: 0.0.0.0, port_value: 8000}
      listener_filters:
        - name: envoy.filters.listener.original_dst
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mec_placement_face
                route_config:
                  name: face_detection_route
                  virtual_hosts:
                    - name: face_detection
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route: {cluster: face_detection, timeout: 10s}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: face_detection
      connect_timeout: 2s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: face_detection
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mec-placement-face-detection.services.svc.cluster.local
                      port_value: 5000
admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}
