apiVersion: apps/v1
kind: Deployment
metadata:
  name: mec-placement-pedestrian-detection
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mec-placement-pedestrian-detection
  template:
    metadata:
      labels:
        app: mec-placement-pedestrian-detection
    spec:
      schedulerName: default-scheduler
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - gnb1
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - gnb-2
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - gnb-3
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - core-5g
      containers:
      - name: pedestrian-detection
        image: 10.34.211.140:30500/pedestrian-detection@sha256:44878a87af1976556d975a1748ffc730300570a98e6e692c42db6f346afe8abc
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        - name: health
          containerPort: 5001
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: HTTP_THREADS
          value: '5'
        - name: ORT_THREADS
          value: '1'
        - name: HEALTH_PORT
          value: '5001'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        startupProbe:
          httpGet:
            path: /ready
            port: health
          periodSeconds: 2
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: mec-placement-pedestrian-detection
  namespace: services
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  sessionAffinity: None
  selector:
    app: mec-placement-pedestrian-detection
  ports:
  - name: http
    port: 5000
    targetPort: http
    protocol: TCP
