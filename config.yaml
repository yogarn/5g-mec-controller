# The manifest must contain exactly one apps/v1 Deployment. It is read, not applied.
manifest: apps/pedestrian-detection/manifest.yaml
prometheus_url: "http://10.34.211.140:30990"
latency_query: 'ue_request_attempt_duration_p90_seconds{job="ue-telemetry"}'
# Collector p90 includes every measured attempt and is emitted whenever the sliding window is nonempty.
# Fast failures can lower p90, so monitor failures separately.
slo_seconds: 0.15
min_replicas: 1
max_replicas: 100
interval_seconds: 15
# HPA scale-down stabilization default (matches suite profiles). Go placement ignores this field.
scale_down_seconds: 60
mode: mobility-aware
mutate: false
eligible_nodes: [gnb1, gnb-2, gnb-3]
zero_locality_nodes: []
cpu_utilization_query: '1 - avg by (node) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle",node=~"gnb1|gnb-2|gnb-3"}[1m]))'
# Request attempts are a traffic-share proxy, not observed UE mobility or handovers.
mobility_query: 'ue_request_upf_placement_window_attempts{job="ue-telemetry-placement",node=~"gnb1|gnb-2|gnb-3"} / 5'
locality_weight: 0.4
# Periodic highest-positive-delta check; one removal-first replacement at a time.
deschedule_interval_seconds: 30
# CPU-only application: effective total weights are 30% CPU and 30% RAM.
resource_weights: {cpu: 0.5, memory: 0.5}
