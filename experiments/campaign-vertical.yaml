# Vertical offloading campaign profile (distinct from legacy Core-DNN profile).
# All three gNBs keep their local PDU sessions and local UPFs:
#   - gnb-1 (node gnb1):  DNN mec.icn-2.testbed, subnet 172.16.50.0/24, UPF upf-edge-icn-2-0 (172.16.30.11)
#   - gnb-2 (node gnb-2): DNN embb.gnb2.testbed, subnet 10.63.1.0/24,   UPF upf-gnb-2-0      (172.16.20.70)
#   - gnb-3 (node gnb-3): DNN embb.gnb3.testbed, subnet 10.64.1.0/24,   UPF upf-gnb-3-0      (172.16.20.200)
# UEs always send requests to their site's local Envoy ingress NodePort; Core offloader
# dynamically steers per-site traffic between local_backend and core_backend via xDS.
workload: pedestrian-detection
radio_only_gnb1: false
ue_host: member@10.34.211.6
ue_project: /home/member/skripsi_yoga/5g-mec-controller
inventory: /home/member/skripsi_yoga/5g-mec-controller/.private/ue-paper-24/inventory.yaml
nr_ue: /home/member/5g-ai-edge/ueransim/build/nr-ue
token: /home/member/.config/5g-mec/ue-telemetry-token
image: /home/member/skripsi_yoga/5g-mec-controller/apps/pedestrian-detection/images
site_node_ips:
  gnb-1: 10.34.211.157
  gnb-2: 10.34.211.196
  gnb-3: 10.34.210.3
envoy_site_ports:
  gnb-1: 31801
  gnb-2: 31802
  gnb-3: 31803
# Authenticated internal admin endpoint (ClusterIP or core-5g port-forward:
#   kubectl -n placement port-forward svc/vertical-offloader-admin 18086:8086).
# Token is read from offloader_token_file at runtime; never stored in repo or artifacts.
offloader_url: http://127.0.0.1:18086
offloader_token_file: /home/member/.config/5g-mec/ue-telemetry-token
# Shared total ceiling. Each arm starts with 3 edge anchors and vertical also starts with 3 Core fallback pods.
# The native HPA is seeded once at traffic start. Managed range is 1..15 local-only or 1..12 vertical.
min_replicas: 6
max_replicas: 18
core_backend_replicas: 3
core_counts_toward_budget: true
telemetry_url: http://10.34.211.140:31669/observations
schedule: '9:7:1:1,9:5:3:1,9:3:5:1,9:1:7:1,9:1:5:3,9:1:3:5,9:1:1:7'
phase_duration: 60
