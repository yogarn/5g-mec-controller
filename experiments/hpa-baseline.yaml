# Experimental baseline only; do not run alongside another replica writer.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mec-placement-face-detection-baseline
  namespace: open5gs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mec-placement-face-detection
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
