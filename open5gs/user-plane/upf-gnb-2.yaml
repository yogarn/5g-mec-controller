apiVersion: v1
kind: ConfigMap
metadata:
  name: upf-gnb-2-config
  namespace: open5gs
data:
  upf.yaml: |
    logger:
      level: info
      file:
        path: /var/log/open5gs/upf.log
        timestamp: true
      default:
        timestamp: true
    global:
      max:
        ue: 1024
    upf:
      pfcp:
        server:
          - address: 172.16.20.70
            port: 8805
        client:
          smf:
            - address: 172.16.10.4
      gtpu:
        server:
          - address: 172.16.20.70
            port: 2152
      session:
        - subnet: 10.63.1.0/24
          gateway: 10.63.1.1
          dnn: embb.gnb2.testbed
          dev: ogstun2s
      metrics:
        server:
          - address: 0.0.0.0
            port: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: upf-gnb-2
  namespace: open5gs
spec:
  replicas: 1
  serviceName: upf-gnb-2
  selector:
    matchLabels:
      app: upf-gnb-2
  template:
    metadata:
      labels:
        app: upf-gnb-2
      annotations:
        cni.projectcalico.org/ipAddrs: '["172.16.20.70"]'
    spec:
      nodeSelector:
        site: gnb-2
      containers:
      - name: upf
        image: 10.34.211.140:30500/open5gs-upf:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_URI
          value: mongodb://mongodb.open5gs.svc.cluster.local:27017/open5gs
        ports:
        - {containerPort: 8805, name: pfcp, protocol: UDP}
        - {containerPort: 2152, name: gtpu, protocol: UDP}
        - {containerPort: 9090, name: metrics, protocol: TCP}
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                ip tuntap add name ogstun2s mode tun 2>/dev/null || true
                ip addr flush dev ogstun2s 2>/dev/null || true
                ip addr add 10.63.1.1/24 dev ogstun2s
                ip link set ogstun2s up
                ip route replace 10.63.1.0/24 dev ogstun2s src 10.63.1.1
                iptables -t nat -C POSTROUTING -s 10.63.1.0/24 ! -o ogstun2s -j MASQUERADE 2>/dev/null || \
                  iptables -t nat -A POSTROUTING -s 10.63.1.0/24 ! -o ogstun2s -j MASQUERADE
        startupProbe:
          exec: {command: [pgrep, open5gs-upfd]}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          exec: {command: [pgrep, open5gs-upfd]}
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          exec: {command: [pgrep, open5gs-upfd]}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: "2", memory: 1Gi}
        securityContext:
          privileged: true
          capabilities:
            add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
        volumeMounts:
        - {mountPath: /etc/open5gs/custom, name: config}
        - {mountPath: /var/log/open5gs, name: logs, subPath: upf-gnb-2}
        - {mountPath: /dev/net/tun, name: dev-net-tun}
      volumes:
      - name: config
        configMap:
          name: upf-gnb-2-config
      - name: logs
        emptyDir: {medium: Memory, sizeLimit: 64Mi}
      - name: dev-net-tun
        hostPath: {path: /dev/net/tun, type: CharDevice}
