# In-cluster RBAC, mounted configuration, and Deployment for the Go placement-controller
# (schedulerName: mec-placement-scheduler + policy/v1 descheduler).
# Build & push from core-5g (use localhost:30500 so Docker uses HTTP without daemon.json):
#   docker build --network=host -t localhost:30500/placement-controller:latest placement
#   docker push localhost:30500/placement-controller:latest
apiVersion: v1
kind: ServiceAccount
metadata:
  name: placement-controller
  namespace: placement
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: placement-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: placement-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: placement-controller
subjects:
  - kind: ServiceAccount
    name: placement-controller
    namespace: placement
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: placement-controller-config
  namespace: placement
data:
  config.yaml: |
    manifest: /etc/placement/manifest.yaml
    namespace: services
    prometheus_url: "http://placement-prometheus.placement.svc:9090"
    mode: mobility-aware
    mutate: true
    scheduler_name: mec-placement-scheduler
    deschedule_interval_seconds: 30
    prefer_close: true
    eligible_nodes: [gnb1, gnb-2, gnb-3]
    # Kept until placement-controller image is rebuilt (legacy binary requires gpu_nodes).
    gpu_nodes: [gnb-2, gnb-3]
    cpu_utilization_query: '1 - avg by (node) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle",node=~"gnb1|gnb-2|gnb-3"}[1m]))'
    mobility_query: 'ue_request_upf_placement_window_attempts{job="ue-telemetry-placement",node=~"gnb1|gnb-2|gnb-3"} / 5'
  manifest.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mec-placement-pedestrian-detection
      namespace: services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-controller
  namespace: placement
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: placement-controller
  template:
    metadata:
      labels:
        app: placement-controller
    spec:
      nodeSelector:
        site: core
      serviceAccountName: placement-controller
      containers:
        - name: placement-controller
          # Timing-instrumented release built from source commit 74c8752.
          image: 10.34.211.140:30500/placement-controller@sha256:a5b74f7d69945f41f5815df571e403a51425f4742625b3fd311c0b080abb9cfe
          imagePullPolicy: Always
          args:
            - --config=/etc/placement/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/placement
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: placement-controller-config
