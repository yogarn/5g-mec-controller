apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: placement
data:
  config.yaml: "externalRules:\n- seriesQuery: ue_request_attempt_duration_p90_seconds{job=\"\
    ue-telemetry\"}\n  resources:\n    namespaced: false\n  name:\n    matches: ^ue_request_attempt_duration_p90_seconds$\n\
    \    as: ue_p90_latency_seconds\n  metricsQuery: ue_request_attempt_duration_p90_seconds{job=\"\
    ue-telemetry\"}\n- seriesQuery: ue_request_attempt_duration_p90_seconds{job=\"\
    ue-telemetry\"}\n  resources:\n    namespaced: false\n  name:\n    matches: ^ue_request_attempt_duration_p90_seconds$\n\
    \    as: ue_p90_excess_latency_120ms_seconds\n  metricsQuery: clamp_min(ue_request_attempt_duration_p90_seconds{job=\"\
    ue-telemetry\"}\n    - 0.12, 0)\n"
