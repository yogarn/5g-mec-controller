apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mec-placement-pedestrian-detection-baseline
  namespace: services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mec-placement-pedestrian-detection
  minReplicas: 3
  maxReplicas: 18
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
