apiVersion: apps/v1
kind: Deployment
metadata:
  name: mec-placement-pedestrian-detection-anchor-gnb-1
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mec-placement-pedestrian-detection
      mec-replica: anchor-gnb-1
  template:
    metadata:
      labels:
        app: mec-placement-pedestrian-detection
        mec-replica: anchor-gnb-1
      annotations:
        cni.projectcalico.org/ipv4pools: '["mec-campaign-reserved"]'
    spec:
      terminationGracePeriodSeconds: 60
      schedulerName: default-scheduler
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - gnb1
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - gnb-2
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - gnb-3
      containers:
      - name: pedestrian-detection
        image: 10.34.211.140:30500/pedestrian-detection@sha256:5245d82fcec53c68db02844135a38eed05e7ee263b987571d38e16d1f4e0d269
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 35
        ports:
        - name: http
          containerPort: 5000
        - name: health
          containerPort: 5001
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: health
        livenessProbe:
          httpGet:
            path: /health
            port: health
        env:
        - name: HTTP_THREADS
          value: '5'
        - name: ORT_THREADS
          value: '1'
        - name: HEALTH_PORT
          value: '5001'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        startupProbe:
          httpGet:
            path: /ready
            port: health
          periodSeconds: 2
          failureThreshold: 60
      nodeSelector:
        kubernetes.io/hostname: gnb1
---
