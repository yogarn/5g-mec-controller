apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-grafana
  namespace: placement
  labels:
    app.kubernetes.io/name: placement-grafana
    app.kubernetes.io/part-of: 5g-ai-edge-placement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placement-grafana
  template:
    metadata:
      labels:
        app: placement-grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-node-resources
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: placement-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: placement-grafana-dashboard-provider
        - name: dashboard-node-resources
          configMap:
            name: placement-grafana-dashboard-node-resources
---
apiVersion: v1
kind: Service
metadata:
  name: placement-grafana
  namespace: placement
  labels:
    app.kubernetes.io/name: placement-grafana
spec:
  type: NodePort
  selector:
    app: placement-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30031
