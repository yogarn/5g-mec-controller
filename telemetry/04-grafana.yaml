        "time_options": ["1m", "2m", "5m", "15m", "30m", "1h", "3h", "6h", "12h", "24h"]
      },
      "timezone": "browser",
      "title": "Placement Node Resources (CPU, RAM, GPU, VRAM)",
      "uid": "placement-node-resources",
      "version": 7
