apiVersion: v1
kind: ConfigMap
metadata:
  name: placement-grafana-datasources
  namespace: placement
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: PlacementPrometheus
        type: prometheus
        access: proxy
        uid: placement-prometheus
        url: http://placement-prometheus.placement.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: placement-grafana-dashboard-provider
  namespace: placement
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'placement-dashboards'
        orgId: 1
        folder: 'Placement'
        type: file
        disableDeletion: true
        allowUiUpdates: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
