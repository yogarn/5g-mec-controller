apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcgm-exporter
  namespace: placement
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: placement
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/component: gpu-metrics-collector
    app.kubernetes.io/part-of: 5g-ai-edge-placement
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
    spec:
      serviceAccountName: dcgm-exporter
      nodeSelector:
        hardware-type: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
          imagePullPolicy: IfNotPresent
          env:
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            - name: DCGM_EXPORTER_INTERVAL
              value: "1000"
          ports:
            - name: gpu-metrics
              containerPort: 9400
              hostPort: 9400
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: nvml
              mountPath: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
              readOnly: true
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: nvml
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: placement
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: dcgm-exporter
  ports:
    - name: gpu-metrics
      port: 9400
      targetPort: 9400
