# Merge this job into the existing scrape_configs; do not replace other jobs.
scrape_configs:
  - job_name: ue-telemetry
    scrape_interval: 15s
    static_configs:
      - targets: ['ue-telemetry.placement.svc.cluster.local:8080']
  - job_name: ue-telemetry-placement
    scrape_interval: 1s
    metrics_path: /metrics/placement
    static_configs:
      - targets: ['ue-telemetry.placement.svc.cluster.local:8080']
