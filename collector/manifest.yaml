apiVersion: v1
kind: ConfigMap
metadata:
  name: ue-telemetry-config
  namespace: services
data:
  config.yaml: |
    window_seconds: 15
    max_observations: 100000
    mapping_refresh_seconds: 3
    mapping_max_age_seconds: 10
    slo_seconds: 0.5
    smf_url: http://10.34.211.140:9090/pdu-info
    amf_url: http://10.34.211.140:9005/ue-info
    gnb_nodes: {0: gnb1, 2: gnb-2, 3: gnb-3}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-telemetry
  namespace: services
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ue-telemetry}
  template:
    metadata:
      labels: {app: ue-telemetry}
    spec:
      nodeSelector:
        site: core
      containers:
        - name: collector
          image: 10.34.211.140:30500/ue-telemetry-collector:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: UE_TELEMETRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ue-telemetry-token
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/ue-telemetry
              readOnly: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: ue-telemetry-config
---
apiVersion: v1
kind: Service
metadata:
  name: ue-telemetry
  namespace: services
spec:
  # Kubernetes allocates nodePort; inspect the Service after creation.
  type: NodePort
  selector: {app: ue-telemetry}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
